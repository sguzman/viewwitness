[package]
name = "viewwitness"
version = "0.0.1"
edition = "2024"
description = "Structured, serializable witnesses of observed GUI state"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sguzman/viewwitness"

[features]
default = []
egui = ["dep:egui"]
observer = ["egui", "dep:egui_inspection"]
showcase = ["egui", "dep:eframe"]

[dependencies]
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "inspection", "wayland", "x11"] }
egui = { version = "0.36.2", optional = true, default-features = false }
egui_inspection = { version = "0.36.2", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"

[[example]]
name = "egui_capture"
required-features = ["egui"]

[[example]]
name = "inspection_capture"
required-features = ["observer"]

[[example]]
name = "showcase"
required-features = ["showcase"]
