name: M5 Live Source Repair

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/m5-live-showcase.yml"
      - "scripts/m5-live-showcase.sh"
      - "scripts/m5-source-repair-loop.sh"
      - "scripts/m5-clip-repair-loop.sh"
      - "scripts/m5-capture-handle-baseline.sh"
      - "scripts/m5-reference-handle-patcher.sh"
      - "scripts/m5-verify-handle-candidate.sh"
      - "scripts/m5-verify-agent-patch.sh"
      - "scripts/m5-prepare-agent-sandbox.sh"
      - "prompts/m5-handle-repair.md"
      - "examples/showcase.rs"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: m5-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0

      - name: Build showcase and exact observer
        run: |
          cargo build --example showcase --features showcase
          cargo build --features egui --bin viewwitness

      - name: Execute live handle source repair loop
        run: bash scripts/m5-source-repair-loop.sh

      - name: Execute live clipping source repair loop
        run: bash scripts/m5-clip-repair-loop.sh

      - name: Capture mutation-free broken baseline
        run: bash scripts/m5-capture-handle-baseline.sh target/m5-separated/baseline

      - name: Produce candidate with isolated reference patcher
        run: bash scripts/m5-reference-handle-patcher.sh target/m5-separated/patcher

      - name: Verify candidate without repair recipe
        run: bash scripts/m5-verify-handle-candidate.sh target/m5-separated/baseline target/m5-separated/verifier

      - name: Prepare recipe-free coding-agent sandbox
        run: bash scripts/m5-prepare-agent-sandbox.sh target/m5-separated/baseline target/m5-stage-e/agent-task

      - name: Exercise trusted clean-worktree candidate gate
        run: |
          bash scripts/m5-verify-agent-patch.sh \
            target/m5-separated/baseline \
            target/m5-separated/patcher/candidate.patch \
            target/m5-stage-e/reference-control

      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-live-source-repair-evidence
          path: |
            target/m5-source-repair/
            target/m5-clip-repair/
            target/m5-separated/
            target/m5-stage-e/
          if-no-files-found: error
